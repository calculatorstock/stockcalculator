<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>
body{font-family:Arial;background:#101820;color:#fff;margin:0;padding:0}header{padding:15px;background:#0b5ed7;text-align:center}header h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:15px}.card{background:#1a2332;padding:20px;border-radius:8px;cursor:pointer;text-align:center;border:2px solid #0b5ed7;transition:all 0.3s}.card:hover{background:#0b5ed7;transform:scale(1.05)}.modal{display:none;position:fixed;z-index:1;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5);animation:fadeIn 0.3s}.modal.show{display:block}.box{background:#1a2332;margin:10% auto;padding:20px;border:2px solid #0b5ed7;width:90%;max-width:400px;border-radius:8px}.box button{background:#0b5ed7;color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;margin:10px 5px}.box button:hover{background:#0a58ca}.box input{width:100%;padding:10px;margin:10px 0;box-sizing:border-box;background:#0f1419;color:#fff;border:1px solid #0b5ed7;border-radius:4px}.box h3{color:#0b5ed7;margin-top:0}#x{margin-top:15px;padding:10px;background:#0f1419;border-radius:4px;text-align:center;font-size:18px;color:#4caf50}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style></head><body><header><h2>📈 Stock Market Calculator Hub</h2></header><div class='grid'><div class='card' onclick="openCalc('sip')">SIP</div><div class='card' onclick="openCalc('cagr')">CAGR</div><div class='card' onclick="openCalc('pl')">Profit/Loss</div><div class='card' onclick="openCalc('avg')">Average Price</div><div class='card' onclick="openCalc('rr')">Risk/Reward</div><div class='card' onclick="openCalc('ps')">Position Size</div><div class='card' onclick="openCalc('brok')">Brokerage</div><div class='card' onclick="openCalc('div')">Dividend Yield</div><div class='card' onclick="openCalc('mc')">Market Cap</div><div class='card' onclick="openCalc('pe')">P/E Ratio</div><div class='card' onclick="openCalc('ci')">Compound Interest</div><div class='card' onclick="openCalc('lum')">Lumpsum</div></div><div id='modal' class='modal'><div class='box'><button onclick='closeM()'>Close</button><div id='content'></div><div id='x'></div></div></div><script>
function openCalc(t){
let h='';
switch(t){
case 'sip':h=`<h3>SIP Calculator</h3><input id=m placeholder='Monthly Amount (₹)'><input id=r placeholder='Annual Return %'><input id=y placeholder='Years'><button onclick="let R=r.value/1200,N=y.value*12,F=m.value*((Math.pow(1+R,N)-1)/R)*(1+R);x.innerHTML='<strong>Future Value: ₹ '+F.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'cagr':h=`<h3>CAGR Calculator</h3><input id=a placeholder='Starting Value (₹)'><input id=b placeholder='Ending Value (₹)'><input id=c placeholder='Number of Years'><button onclick="let cagr=((Math.pow(b.value/a.value,1/c.value)-1)*100);x.innerHTML='<strong>CAGR: '+cagr.toFixed(2)+'%</strong>'">Calculate</button>`;break;
case 'pl':h=`<h3>Profit/Loss Calculator</h3><input id=bp placeholder='Buy Price (₹)'><input id=sp placeholder='Sell Price (₹)'><input id=q placeholder='Quantity'><button onclick="let pl=(sp.value-bp.value)*q.value;x.innerHTML='<strong>P/L: ₹ '+pl.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'avg':h=`<h3>Average Price Calculator</h3><input id=p1 placeholder='Price 1 (₹)'><input id=q1 placeholder='Qty 1'><input id=p2 placeholder='Price 2 (₹)'><input id=q2 placeholder='Qty 2'><button onclick="let avg=(p1.value*q1.value+p2.value*q2.value)/(q1.value+q2.value);x.innerHTML='<strong>Average Price: ₹ '+avg.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'rr':h=`<h3>Risk/Reward Ratio</h3><input id=e placeholder='Entry Price (₹)'><input id=sl placeholder='Stop Loss (₹)'><input id=tp placeholder='Target (₹)'><button onclick="let rr=(tp.value-e.value)/(e.value-sl.value);x.innerHTML='<strong>Risk/Reward: '+rr.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'ps':h=`<h3>Position Size Calculator</h3><input id=cap placeholder='Capital (₹)'><input id=risk placeholder='Risk %'><input id=ers placeholder='Entry-SL Difference (₹)'><button onclick="let ps=Math.floor((cap.value*risk.value/100)/ers.value);x.innerHTML='<strong>Position Size: '+ps+' units</strong>'">Calculate</button>`;break;
case 'brok':h=`<h3>Brokerage Calculator</h3><input id=val placeholder='Trade Value (₹)'><input id=br placeholder='Brokerage %'><button onclick="let b=(val.value*br.value/100);x.innerHTML='<strong>Brokerage: ₹ '+b.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'div':h=`<h3>Dividend Yield Calculator</h3><input id=dps placeholder='Dividend per Share (₹)'><input id=price placeholder='Current Price (₹)'><button onclick="let dy=(dps.value/price.value*100);x.innerHTML='<strong>Dividend Yield: '+dy.toFixed(2)+'%</strong>'">Calculate</button>`;break;
case 'mc':h=`<h3>Market Cap Calculator</h3><input id=sp placeholder='Share Price (₹)'><input id=shares placeholder='Total Shares (in Cr)'><button onclick="let mc=(sp.value*shares.value);x.innerHTML='<strong>Market Cap: ₹ '+mc.toFixed(2)+' Cr</strong>'">Calculate</button>`;break;
case 'pe':h=`<h3>P/E Ratio Calculator</h3><input id=pp placeholder='Price per Share (₹)'><input id=eps placeholder='EPS (₹)'><button onclick="let pe=(pp.value/eps.value);x.innerHTML='<strong>P/E Ratio: '+pe.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'ci':h=`<h3>Compound Interest Calculator</h3><input id=principal placeholder='Principal (₹)'><input id=rate placeholder='Rate %'><input id=time placeholder='Time (Years)'><button onclick="let ci=principal.value*(Math.pow(1+rate.value/100,time.value)-1);x.innerHTML='<strong>Interest: ₹ '+ci.toFixed(2)+'</strong>'">Calculate</button>`;break;
case 'lum':h=`<h3>Lumpsum Investment Calculator</h3><input id=amt placeholder='Amount (₹)'><input id=rr placeholder='Annual Return %'><input id=yr placeholder='Years'><button onclick="let fv=amt.value*Math.pow(1+rr.value/100,yr.value);x.innerHTML='<strong>Future Value: ₹ '+fv.toFixed(2)+'</strong>'">Calculate</button>`;break;
default:h=`<h3>${t}</h3><p>Calculator loading...</p>`;
}
document.getElementById('content').innerHTML=h;document.getElementById('x').innerHTML='';document.getElementById('modal').style.display='block';
}
function closeM(){document.getElementById('modal').style.display='none'}
</script></body></html>
